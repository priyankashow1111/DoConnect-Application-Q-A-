spring.application.name=api-gateway
# Server port
server.port=8765

# Eureka - register with eureka server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable gateway discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ===== ROUTING RULES =====

# Route 1 - User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

# Route 2 - Question routes (also in user service)
spring.cloud.gateway.routes[1].id=question-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/questions/**

# Route 3 - Answer routes (also in user service)
spring.cloud.gateway.routes[2].id=answer-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/answers/**

# Route 4 - Like routes (also in user service)
spring.cloud.gateway.routes[3].id=like-service
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/likes/**

# Route 5 - Comment routes (also in user service)
spring.cloud.gateway.routes[4].id=comment-service
spring.cloud.gateway.routes[4].uri=lb://user-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/comments/**

# Route 6 - Chat routes (also in user service)
spring.cloud.gateway.routes[5].id=chat-service
spring.cloud.gateway.routes[5].uri=lb://user-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/chat/**

# Route 7 - Admin Service
spring.cloud.gateway.routes[6].id=admin-service
spring.cloud.gateway.routes[6].uri=lb://admin-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/admin/**

# Route 8 - Notification Service
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://notification-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG