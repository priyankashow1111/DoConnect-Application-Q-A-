<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - DoConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">Do<span>Connect</span></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="my-questions.html">📋 My Questions</a>
        <a href="chat.html">💬 Chat</a>
        <span class="nav-username">👤 <strong id="navUser"></strong></span>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</nav>

<div class="container" style="max-width:600px;">
    <div class="card">
        <h2 style="margin-bottom:20px; color:#2c3e50;">👤 My Profile</h2>
        <div id="alert"></div>

        <div class="form-group">
            <label>Username (cannot be changed)</label>
            <input type="text" id="username" disabled style="background:#f0f0f0; color:#888;">
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
            <label>New Password <span style="color:#999; font-weight:normal;">(leave blank to keep current)</span></label>
            <input type="password" id="password" placeholder="Enter new password">
        </div>

        <button class="btn btn-primary" onclick="updateProfile()">💾 Save Changes</button>
    </div>
</div>

<footer style="text-align:center; padding:20px; color:#999; font-size:13px; margin-top:40px; border-top:1px solid #eee;">
    © 2024 DoConnect — Q&A Community Platform
</footer>

<script src="js/api.js"></script>
<script>
    if (!localStorage.getItem('token')) window.location.href = 'login.html';

    document.getElementById('navUser').textContent = localStorage.getItem('username');

    async function loadProfile() {
        try {
            const res = await fetch(`${BASE_URL}/api/users/profile`, {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            const user = await res.json();
            document.getElementById('username').value = user.username;
            document.getElementById('fullName').value = user.fullName || '';
            document.getElementById('email').value = user.email;
        } catch (err) {
            showAlert('Failed to load profile', 'error');
        }
    }

    async function updateProfile() {
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const userId = localStorage.getItem('userId');

        if (!email) { showAlert('Email is required', 'error'); return; }

        try {
            const username = document.getElementById('username').value;
            const res = await fetch(`${BASE_URL}/api/users/update/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({ username, fullName, email, password })
            });
            const data = await res.json();
            if (data.userId) {
                showAlert('✅ Profile updated successfully!', 'success');
                document.getElementById('password').value = '';
            } else {
                showAlert(data.error || 'Update failed', 'error');
            }
        } catch (err) {
            showAlert('Server error. Please try again.', 'error');
        }
    }

    function showAlert(msg, type) {
        document.getElementById('alert').innerHTML =
            `<div class="alert alert-${type}">${msg}</div>`;
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    loadProfile();
</script>
</body>
</html>
