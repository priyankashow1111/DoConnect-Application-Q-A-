version: '3.9'

services:

  app:
    image: metroride-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metroride-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    restart: unless-stopped
    networks:
      - metroride-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/metro/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  monitor:
    image: busybox
    container_name: metroride-monitor
    command: sh -c "while true; do echo '[monitor] ping app: ok'; sleep 10; done"
    depends_on:
      - app
    networks:
      - metroride-net
    restart: unless-stopped

networks:
  metroride-net:
    driver: bridge
