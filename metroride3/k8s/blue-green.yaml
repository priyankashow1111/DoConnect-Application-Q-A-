# =============================================================
# Blue/Green Deployment Strategy
# Two identical environments run in parallel.
# "Blue" = current live version
# "Green" = new version being tested
# Traffic is switched by updating the Service selector.
# Instant rollback: just switch selector back to blue.
# =============================================================

# --- BLUE Deployment (currently live: v1.0.0) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metroride-api-blue
  namespace: default
  labels:
    app: metroride-api
    slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metroride-api
      slot: blue
  template:
    metadata:
      labels:
        app: metroride-api
        slot: blue
    spec:
      containers:
        - name: metroride-api
          image: myregistry/metroride-api:1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

---
# --- GREEN Deployment (new version: v1.1.0, not yet live) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metroride-api-green
  namespace: default
  labels:
    app: metroride-api
    slot: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metroride-api
      slot: green
  template:
    metadata:
      labels:
        app: metroride-api
        slot: green
    spec:
      containers:
        - name: metroride-api
          image: myregistry/metroride-api:1.1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

---
# --- Service: points to BLUE by default ---
# To switch to GREEN: change selector slot: blue -> slot: green
apiVersion: v1
kind: Service
metadata:
  name: metroride-api-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: metroride-api
    slot: blue        # <-- change to "green" to switch live traffic
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

# --- Switch traffic to GREEN (after testing): ---
# kubectl patch svc metroride-api-svc -p '{"spec":{"selector":{"slot":"green"}}}'
#
# --- Rollback to BLUE: ---
# kubectl patch svc metroride-api-svc -p '{"spec":{"selector":{"slot":"blue"}}}'
