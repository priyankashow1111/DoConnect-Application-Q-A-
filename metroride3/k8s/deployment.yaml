apiVersion: apps/v1
kind: Deployment
metadata:
  name: metroride-api
  namespace: default
  labels:
    app: metroride-api
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metroride-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: metroride-api
        version: "1.0.0"
    spec:
      containers:
        - name: metroride-api
          image: myregistry/metroride-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/metro/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/metro/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8080"
