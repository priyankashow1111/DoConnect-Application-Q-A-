# KEDA Installation (run once):
# helm repo add kedacore https://kedacore.github.io/charts
# helm repo update
# helm install keda kedacore/keda --namespace keda --create-namespace

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: metroride-api-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: metroride-api
  minReplicaCount: 1
  maxReplicaCount: 15
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    # Scale based on RabbitMQ queue length (metro-requests queue)
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: metro-requests
        mode: QueueLength
        value: "10"           # scale up when queue > 10 messages
      authenticationRef:
        name: rabbitmq-trigger-auth

---
# TriggerAuthentication — stores RabbitMQ credentials securely
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: default
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-secret
      key: host

---
# Secret for RabbitMQ connection (base64-encoded values)
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: default
type: Opaque
stringData:
  host: amqp://guest:guest@rabbitmq-svc.default.svc.cluster.local:5672/
