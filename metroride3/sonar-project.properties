# ==============================================
# SonarQube Project Configuration — MetroRide
# ==============================================

sonar.projectKey=metroride-api
sonar.projectName=MetroRide API
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=java

# SonarQube server (change to your local instance)
sonar.host.url=http://localhost:9000
sonar.login=your_sonar_token_here

# Coverage reports (if using Jacoco)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/generated/**,**/*Test.java
